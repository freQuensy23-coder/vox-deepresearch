daemon off;
pid /run/vox-migration-nginx.pid;
error_log /workspace/vox-openclaw-dp/migration/native-logs/proxy-error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /workspace/vox-openclaw-dp/migration/native-logs/proxy-access.log;
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^https" https;
    }
    server {
        listen 127.0.0.1:8000;
        server_name _;
        client_max_body_size 101M;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://127.0.0.1:18091;
        }
        location /api/ { proxy_pass http://127.0.0.1:18091; }
        location / { proxy_pass http://127.0.0.1:3000; }
    }
}
